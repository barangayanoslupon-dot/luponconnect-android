name: Build Android APK

on:
  workflow_dispatch:      # build only when YOU press "Run workflow" (no more failed builds while uploading files)

permissions:
  contents: write         # needed to publish the APK in Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the project files are in the right place
        run: |
          ls -la
          test -f settings.gradle || { echo "ERROR: settings.gradle not found. The project files must be at the TOP of the repo, not inside another folder."; exit 1; }
          test -f app/build.gradle || { echo "ERROR: app/build.gradle not found."; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing key (if you added the secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/lupon.p12"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/lupon.p12" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found: $APK"
          cp "$APK" LuponConnect.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LuponConnect-apk
          path: LuponConnect.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LuponConnect v1.0.${{ github.run_number }}
          body: "I-download ang LuponConnect.apk sa ibaba at i-install sa Android phone."
          files: LuponConnect.apk
