name: Build Android APK

on:
  workflow_dispatch:      # lets you press "Run workflow" by hand
  push:
    branches: [main]

permissions:
  contents: write         # needed to publish the APK in Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing key (if you added the secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lupon.p12"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/lupon.p12" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk LuponConnect.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LuponConnect-apk
          path: LuponConnect.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LuponConnect v1.0.${{ github.run_number }}
          body: "I-download ang LuponConnect.apk sa ibaba at i-install sa Android phone."
          files: LuponConnect.apk
